name: CI Python Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências de linting e formatação
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Verificar imports com isort
      run: |
        isort --check-only .

    - name: Verificar formatação com black
      run: |
        black --check .

    - name: Executar Linting com flake8
      run: |
        # Ignorar erros menores de formatação de linha longa se necessário
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics